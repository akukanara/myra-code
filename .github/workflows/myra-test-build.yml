name: myra-test-build

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build-linux-x64:
    name: Build MyraCode for Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust target
        run: |
          set -euo pipefail
          toolchain="$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("codex-rs/rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain"
          rustup target add --toolchain "$toolchain" x86_64-unknown-linux-musl

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "codex-rs -> target"
          shared-key: "myra-test-linux-x64-v1"
          add-job-id-key: "false"
          cache-workspace-crates: "true"

      - name: Set up prebuilt V8
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-musl

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
          use-cache: true

      - name: Install Linux build tools
        env:
          TARGET: x86_64-unknown-linux-musl
        run: |
          set -euo pipefail
          bash .github/scripts/install-musl-build-tools.sh
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"

      - name: Build test package
        run: |
          set -euo pipefail
          python scripts/build_codex_package.py \
            --target x86_64-unknown-linux-musl \
            --cargo-profile release \
            --package-dir vendor/x86_64-unknown-linux-musl \
            --force

      - name: Upload MyraCode Linux package
        uses: actions/upload-artifact@v4
        with:
          name: myra-linux-x64
          path: vendor/x86_64-unknown-linux-musl
          if-no-files-found: error
