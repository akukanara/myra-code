name: scratch-verify

on:
  push:
    branches: [feat/myractx-guidance]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust
        run: |
          set -euo pipefail
          toolchain="$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("codex-rs/rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain"

      - name: Set up rusty_v8
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "codex-rs -> target"
          cache-targets: "false"

      - name: Refresh TUI snapshots
        env:
          INSTA_UPDATE: always
          INSTA_FORCE_UPDATE: "1"
        run: cargo test -p codex-tui --lib -- image_generation web_fetch web_search myractx
        working-directory: codex-rs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tui-snapshots
          path: codex-rs/tui/src/chatwidget/snapshots

      - name: Run affected tests
        run: |
          set -x
          cargo test -p codex-extension-items
          cargo test -p codex-image-generation-extension
          cargo test -p codex-myra-web-extension
          cargo test -p codex-rollout-trace --lib
          cargo test -p codex-app-server-protocol --lib
          cargo test -p codex-tui --lib -- image_generation web_fetch web_search myractx
          cargo test -p codex-core --lib -- spec_plan
        working-directory: codex-rs
