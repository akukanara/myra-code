name: rust-typecheck

on:
  push:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify public Myra branding
        run: |
          if rg -n -i 'openai|codex|chatgpt' README.md codex-cli/package.json codex-cli/bin scripts/install codex-rs/login/src/assets; then
            echo "Found upstream branding in a user-facing release surface." >&2
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Rust
        run: |
          set -euo pipefail
          toolchain="$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("codex-rs/rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain"

      - name: Set up rusty_v8
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "codex-rs -> target"
          cache-targets: "false"

      - name: Typecheck CLI and app server
        run: cargo check -p codex-cli -p codex-app-server
        working-directory: codex-rs
