<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="referrer" content="no-referrer" />
    <title>Sign-in complete | MyraRouter</title>
    <style>
      :root {
        --page: #eff8e8;
        --surface: #fcfef9;
        --ink: #163e36;
        --muted: #56766a;
        --border: #bdd0c1;
        --badge: #e7eee6;
        --accent: #2b6555;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--page);
        color: var(--ink);
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px 20px;
      }

      .shell {
        width: min(100%, 492px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        margin-bottom: 36px;
        color: var(--ink);
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0;
        text-decoration: none;
      }

      .brand-mark { width: 38px; height: 32px; }

      .card {
        min-height: 322px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 42px 36px;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: var(--surface);
        text-align: center;
      }

      .status-mark {
        display: grid;
        width: 56px;
        height: 56px;
        place-items: center;
        margin-bottom: 20px;
        border-radius: 50%;
        background: var(--badge);
        color: var(--accent);
      }

      h1 {
        margin: 0;
        font-size: 21px;
        font-weight: 650;
        letter-spacing: 0;
        line-height: 1.35;
      }

      p {
        max-width: 330px;
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.45;
      }

      .dashboard-link {
        margin-top: 28px;
        color: var(--ink);
        font-size: 15px;
        font-weight: 650;
        text-decoration: none;
      }

      .dashboard-link:hover { text-decoration: underline; }

      .dashboard-link:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
        border-radius: 2px;
      }

      @media (max-width: 480px) {
        main { padding: 24px 16px; }
        .brand { margin-bottom: 24px; }
        .card { min-height: 300px; padding: 36px 24px; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="shell" aria-labelledby="status-title">
        <a class="brand" id="brand-link" href="https://staging-rt.myralith.dev/dashboard">
          <svg class="brand-mark" viewBox="0 0 64 54" aria-hidden="true">
            <path fill="#b8e928" d="M3 3 32 24 61 3v14L32 38 3 17Z" />
            <path fill="#2e715e" d="M3 17 32 38 61 17v34L32 31 3 51Z" />
            <path fill="#16493e" d="M10 24 32 40 54 24v19L32 29 10 43Z" />
            <path fill="#e9f8e6" d="m32 38 4 3v13h-8V41Z" />
          </svg>
          <span>MyraRouter</span>
        </a>
        <div class="card">
          <div class="status-mark" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="7" stroke="currentColor" stroke-width="1.5" />
              <path d="m8.8 12.2 2.1 2.1 4.4-4.7" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" />
            </svg>
          </div>
          <h1 id="status-title">Device approved</h1>
          <p id="status-message">You can return to your terminal. It will finish signing in automatically.</p>
          <a class="dashboard-link" id="dashboard-link" href="https://staging-rt.myralith.dev/dashboard">Go to dashboard</a>
        </div>
      </section>
    </main>
    <script>
      (function () {
        const dashboardUrl = "https://staging-rt.myralith.dev/dashboard";
        const params = new URLSearchParams(window.location.search);
        const needsSetup = params.get("needs_setup") === "true";

        document.getElementById("brand-link").href = dashboardUrl;
        document.getElementById("dashboard-link").href = dashboardUrl;
        window.history.replaceState(null, "", window.location.pathname);

        if (needsSetup) {
          document.getElementById("status-title").textContent = "Finish setting up your account";
          document.getElementById("status-message").textContent = "Continue in your MyraRouter dashboard to complete account setup.";
        }
      })();
    </script>
  </body>
</html>
